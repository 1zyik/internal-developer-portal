apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name | dump }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/1zyik-platform/${{ values.name }}.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.name | dump }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
